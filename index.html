<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Calabouço Restaurante e Pizzaria | Pizza à luz de velas no Centro Cívico, Curitiba</title>
    <meta
      name="description"
      content="Pizzaria e restaurante à luz de velas no Centro Cívico de Curitiba, desde 1991. Pizzas da casa com nomes de castelo, massas, mignon e vinhos. Veja o cardápio, ligue ou trace a rota."
    />
    <meta name="theme-color" content="#211813" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="canonical" href="%SITE_URL%" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />

    <!-- Compartilhamento (endereço absoluto definido no build por SITE_URL, ver vite.config.ts) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Calabouço Restaurante e Pizzaria" />
    <meta property="og:title" content="Calabouço Restaurante e Pizzaria | Curitiba" />
    <meta
      property="og:description"
      content="Pizza, massas e vinho à luz de velas no Centro Cívico de Curitiba, desde 1991. Veja o cardápio."
    />
    <meta property="og:image" content="%SITE_URL%og-calabouco.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo do Calabouço Restaurante e Pizzaria, “Pizza, massas e vinho à luz de velas” e imagem ilustrativa de uma pizza com tomate e manjericão." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Pizza da abertura: prioridade máxima (mesmo srcset/sizes do componente Hero) -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      imagesrcset="%BASE_URL%images/pizza-ia-480.avif 480w, %BASE_URL%images/pizza-ia-905.avif 905w, %BASE_URL%images/pizza-ia-1360.avif 1360w"
      imagesizes="(min-width: 900px) 62vw, 100vw"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Calabouço Restaurante e Pizzaria",
        "description": "Pizzaria e restaurante à luz de velas, com pizzas, massas e vinhos em ambiente de inspiração medieval.",
        "url": "%SITE_URL%",
        "image": "%SITE_URL%og-calabouco.jpg",
        "hasMenu": "%SITE_URL%#cardapio",
        "servesCuisine": ["Pizza", "Massas"],
        "telephone": "+55 41 3254-6112",
        "foundingDate": "1991",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Rua Mateus Leme, 1000",
          "addressLocality": "Curitiba",
          "addressRegion": "PR",
          "postalCode": "80530-010",
          "addressCountry": "BR"
        },
        "sameAs": ["https://www.instagram.com/calaboucorestaurante/"]
      }
    </script>
    <!-- Dados estruturados do cardápio (gerados no build a partir de src/content/menu.ts) -->
    <!--menu-json-ld-->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif; color: #f3e9dc; background: #211813">
        Calabouço Restaurante e Pizzaria — Rua Mateus Leme, 1000, Centro Cívico, Curitiba/PR · (41) 3254-6112.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
