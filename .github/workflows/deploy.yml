# Verifica e publica o site no GitHub Pages.
# - Em qualquer branch: instala, roda o lint e gera o site (confere se nada quebrou).
# - Na branch padrão do repositório: também publica, se o GitHub Pages estiver ativado
#   em Settings → Pages → Source: “GitHub Actions”. Enquanto não estiver, o workflow
#   só avisa (sem falhar). Depois de ativar, rode de novo em Actions → Run workflow.
name: Publicar site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verificar e gerar o site
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.pages-check.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar se o GitHub Pages está ativado
        id: pages-check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IS_DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          publish=false
          if [ "$IS_DEFAULT_BRANCH" = "true" ]; then
            status=$(curl -s -o pages.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pages")
            if [ "$status" = "200" ] && [ "$(jq -r .build_type pages.json)" = "workflow" ]; then
              publish=true
            else
              echo "::notice title=GitHub Pages ainda não ativado (HTTP $status)::Abra Settings → Pages e escolha Source: GitHub Actions. Depois rode este workflow de novo (Actions → Publicar site → Run workflow)."
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Configurar o GitHub Pages
        id: pages
        if: steps.pages-check.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      # SITE_URL e BASE_PATH vêm do próprio Pages (inclusive com domínio próprio)
      - name: Gerar o site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Enviar o site gerado
        if: steps.pages-check.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
